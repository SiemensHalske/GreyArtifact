<!doctype html>
<html lang="de" data-theme="dark">
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <meta
      name="description"
      content="GreyArtifact verwaltet bereits erzeugte Recon-Ergebnisse lokal."
    >
    <title>{% block title %}GreyArtifact{% endblock %}</title>
    <script src="{{ url_for('static', filename='js/theme-init.js') }}"></script>
    <link
      rel="stylesheet"
      href="{{ url_for('static', filename='css/app.css') }}"
    >
    {% block head %}{% endblock %}
  </head>
  <body>
    {% block body %}{% endblock %}
    {% block scripts %}{% endblock %}
  </body>
</html>
